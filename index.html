<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組織の思想史 Book System Map</title>
<style>
body{margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#fbfaf7;color:#17202a;line-height:1.7}
.box{max-width:720px;margin:0 auto;background:#fffdf8;border:1px solid #d8d2c6;border-radius:10px;padding:18px}
.muted{color:#64717f}
button{border:1px solid #1f2933;background:#1f2933;color:#fff;border-radius:8px;padding:9px 12px;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>組織の思想史 Book System Map</h1>
  <p id="status" class="muted">読み込み中です...</p>
  <button id="retry" type="button" hidden>再読み込み</button>
</div>
<script>
const parts = Array.from({length:3},(_,i)=>`chunks/part${i}.b64`);
const statusEl = document.getElementById("status");
const retry = document.getElementById("retry");
async function ungzip(bytes){
  if(!("DecompressionStream" in window)){
    throw new Error("This browser does not support DecompressionStream.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
async function load(){
  retry.hidden = true;
  statusEl.textContent = "Book System Mapを読み込み中です...";
  try{
    const chunks = await Promise.all(parts.map(async path=>{
      const res = await fetch(path,{cache:"no-store"});
      if(!res.ok) throw new Error(`${path}: ${res.status}`);
      return (await res.text()).trim();
    }));
    const bin = atob(chunks.join(""));
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html = await ungzip(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    statusEl.textContent = "読み込みに失敗しました。GitHub Pagesの反映に少し時間がかかっている可能性があります。数十秒後に再読み込みしてください。";
    retry.hidden = false;
    console.error(err);
  }
}
retry.addEventListener("click",load);
load();
</script>
</body>
</html>
